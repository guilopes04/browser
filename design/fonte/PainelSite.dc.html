<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel do site</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4352C4}a:hover{color:#2F3C9A}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; background: #E8E9F0; color: #17181C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">
  <div style="width: 260px; height: 900px; flex: none">
    <dc-import name="Sidebar" space="pessoal" theme="claro" active="p1" panel="site" hint-size="260px,900px"></dc-import>
  </div>
  <main style="flex: 1; min-width: 0; padding: 8px 8px 8px 0; display: flex">
    <div aria-hidden="true" style="flex: 1; background: #FFFFFF; border-radius: 10px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 14px; padding: 124px 312px 0 312px">
      <span style="width: 64%; height: 32px; border-radius: 6px; background: #DFE0E7"></span>
      <span style="height: 14px"></span>
      <span style="width: 100%; height: 12px; border-radius: 3px; background: #EEEEF2"></span>
      <span style="width: 96%; height: 12px; border-radius: 3px; background: #EEEEF2"></span>
      <span style="width: 58%; height: 12px; border-radius: 3px; background: #EEEEF2"></span>
    </div>
  </main>

  <div role="dialog" aria-label="Site electronjs.org" style="position: absolute; left: 16px; top: 140px; width: 328px; box-sizing: border-box; border-radius: 12px; background: #FBFBFD; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.16), 0 14px 40px rgba(0,0,0,0.2)">
    <span aria-hidden="true" style="position: absolute; left: 22px; top: -6px; width: 12px; height: 12px; background: #FBFBFD; transform: rotate(45deg); box-shadow: -0.5px -0.5px 0 0 rgba(0,0,0,0.12)"></span>

    <div style="position: relative; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 600">electronjs.org</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #565863"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="1.5"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg>Conexão segura</span>
    </div>

    <div style="margin: 0 8px; padding: 12px 8px; border-top: 1px solid rgba(23,24,28,0.08); display: flex; flex-direction: column; gap: 10px">
      <label style="position: relative; display: flex; align-items: center; gap: 12px; font-size: 13px">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 600">Bloqueador neste site</span>
          <span style="font-size: 12px; color: #565863">12 anúncios e rastreadores bloqueados nesta página</span>
        </span>
        <input type="checkbox" role="switch" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">
        <span aria-hidden="true" style="flex: none; width: 34px; height: 20px; border-radius: 10px; background: #4352C4; display: flex; align-items: center; justify-content: flex-end; padding: 2px; box-sizing: border-box"><span style="width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span></span>
      </label>
    </div>

    <div style="margin: 0 8px; padding: 10px 8px; border-top: 1px solid rgba(23,24,28,0.08); display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 600; color: #565863; padding-bottom: 6px">Permissões</span>
      <sc-for list="{{perms}}" as="p" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; height: 32px; font-size: 13px">
          <span style="flex: 1">{{p.name}}</span>
          <button type="button" aria-label="{{p.name}}: {{p.value}}" style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border: 0; border-radius: 6px; background: rgba(23,24,28,0.06); font: inherit; font-size: 12.5px; color: #17181C">{{p.value}}<svg aria-hidden="true" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#565863" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"></path></svg></button>
        </div>
      </sc-for>
    </div>

    <div style="margin: 0 8px; padding: 10px 0 8px; border-top: 1px solid rgba(23,24,28,0.08); display: flex; flex-direction: column; gap: 2px">
      <button type="button" style="display: flex; align-items: center; height: 32px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 13px; color: #17181C; text-align: left"><span style="flex: 1">Copiar URL limpa</span><span style="font-size: 12px; color: #565863">⇧⌘C</span></button>
      <button type="button" style="display: flex; align-items: center; height: 32px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 13px; color: #17181C; text-align: left"><span style="flex: 1">Capturar página</span><span style="font-size: 12px; color: #565863">⌥⌘S</span></button>
      <button type="button" style="display: flex; align-items: center; height: 32px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 13px; color: #17181C; text-align: left"><span style="flex: 1">Apagar dados deste site…</span></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      perms: [
        { name: 'Câmera', value: 'Perguntar' },
        { name: 'Microfone', value: 'Perguntar' },
        { name: 'Localização', value: 'Bloquear' },
        { name: 'Notificações', value: 'Bloquear' },
        { name: 'Pop-ups', value: 'Bloquear' }
      ]
    };
  }
}
</script>
</body>
</html>
