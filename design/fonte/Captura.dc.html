<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Captura da página</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4352C4}a:hover{color:#2F3C9A}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #E8E9F0; color: #17181C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">
  <div style="width: 260px; height: 900px; flex: none">
    <dc-import name="Sidebar" space="pessoal" theme="claro" active="p1" hint-size="260px,900px"></dc-import>
  </div>
  <main style="position: relative; flex: 1; min-width: 0; padding: 8px 8px 8px 0; display: flex">
    <div style="position: relative; flex: 1; background: #FFFFFF; border-radius: 10px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08); overflow: hidden">
      <div aria-hidden="true" style="height: 60px; border-bottom: 1px solid #EEEEF2; display: flex; align-items: center; gap: 28px; padding: 0 56px">
        <span style="width: 110px; height: 14px; border-radius: 4px; background: #DFE0E7"></span>
        <span style="flex: 1"></span>
        <span style="width: 56px; height: 10px; border-radius: 3px; background: #E8E9EF"></span>
        <span style="width: 92px; height: 30px; border-radius: 8px; background: #DFE0E7"></span>
      </div>
      <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 14px; padding: 64px 256px">
        <span style="width: 64%; height: 32px; border-radius: 6px; background: #DFE0E7"></span>
        <span style="height: 14px"></span>
        <span style="width: 100%; height: 12px; border-radius: 3px; background: #EEEEF2"></span>
        <span style="width: 96%; height: 12px; border-radius: 3px; background: #EEEEF2"></span>
        <span style="width: 58%; height: 12px; border-radius: 3px; background: #EEEEF2"></span>
        <span style="height: 14px"></span>
        <span style="width: 100%; height: 200px; border-radius: 10px; background: #E6E7EE"></span>
        <span style="height: 14px"></span>
        <span style="width: 100%; height: 12px; border-radius: 3px; background: #EEEEF2"></span>
        <span style="width: 88%; height: 12px; border-radius: 3px; background: #EEEEF2"></span>
      </div>

      <div aria-label="Área selecionada, 700 por 280" style="position: absolute; left: 236px; top: 268px; width: 700px; height: 280px; box-shadow: 0 0 0 1.5px #FFFFFF, 0 0 0 9999px rgba(23,24,28,0.42)">
        <span aria-hidden="true" style="position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 5px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.3)"></span>
        <span aria-hidden="true" style="position: absolute; right: -5px; top: -5px; width: 10px; height: 10px; border-radius: 5px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.3)"></span>
        <span aria-hidden="true" style="position: absolute; left: -5px; bottom: -5px; width: 10px; height: 10px; border-radius: 5px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.3)"></span>
        <span aria-hidden="true" style="position: absolute; right: -5px; bottom: -5px; width: 10px; height: 10px; border-radius: 5px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.3)"></span>
        <span style="position: absolute; right: 0; top: -32px; height: 24px; padding: 0 8px; border-radius: 6px; background: rgba(23,24,28,0.82); color: #FFFFFF; font-size: 12px; display: flex; align-items: center">700 × 280</span>
      </div>
    </div>

    <div role="toolbar" aria-label="Captura" style="position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 8px; border-radius: 14px; background: rgba(250,250,252,0.97); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.14), 0 12px 32px rgba(0,0,0,0.22)">
      <div role="group" aria-label="O que capturar" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(23,24,28,0.06)">
        <button type="button" aria-pressed="true" style="height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.08); font: inherit; font-size: 13px; font-weight: 600; color: #17181C">Área</button>
        <button type="button" aria-pressed="false" style="height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 13px; color: #3A3B42">Parte visível</button>
        <button type="button" aria-pressed="false" style="height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 13px; color: #3A3B42">Página inteira</button>
      </div>
      <div style="width: 1px; height: 22px; background: rgba(0,0,0,0.1); margin: 0 4px"></div>
      <button type="button" style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: rgba(23,24,28,0.07); font: inherit; font-size: 13px; color: #17181C">Salvar…</button>
      <button type="button" style="height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: #4352C4; font: inherit; font-size: 13px; font-weight: 600; color: #FFFFFF">Copiar</button>
      <button type="button" aria-label="Cancelar captura (esc)" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #565863; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7"></path></svg></button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
