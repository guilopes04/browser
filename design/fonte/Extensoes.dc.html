<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Extensões</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4352C4}a:hover{color:#2F3C9A}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; background: #E8E9F0; color: #17181C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">
  <div style="width: 260px; height: 900px; flex: none">
    <dc-import name="Sidebar" space="pessoal" theme="claro" active="p2" domain="github.com" path="/gilas/navegador/pulls" blocked="4" panel="extensoes" hint-size="260px,900px"></dc-import>
  </div>
  <main style="flex: 1; min-width: 0; padding: 8px 8px 8px 0; display: flex">
    <div aria-hidden="true" style="flex: 1; background: #FFFFFF; border-radius: 10px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 10px; padding: 48px 80px">
      <span style="width: 40%; height: 24px; border-radius: 5px; background: #DFE0E7"></span>
      <span style="height: 16px"></span>
      <span style="height: 52px; border-radius: 8px; background: #F3F3F7"></span>
      <span style="height: 52px; border-radius: 8px; background: #F3F3F7"></span>
      <span style="height: 52px; border-radius: 8px; background: #F3F3F7"></span>
      <span style="height: 52px; border-radius: 8px; background: #F3F3F7"></span>
    </div>
  </main>

  <div role="dialog" aria-label="Extensões" style="position: absolute; left: 48px; bottom: 54px; width: 340px; box-sizing: border-box; border-radius: 12px; background: #FBFBFD; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.16), 0 14px 40px rgba(0,0,0,0.2)">
    <span aria-hidden="true" style="position: absolute; left: 32px; bottom: -6px; width: 12px; height: 12px; background: #FBFBFD; transform: rotate(45deg); box-shadow: 0.5px 0.5px 0 0 rgba(0,0,0,0.12)"></span>

    <div style="position: relative; padding: 14px 16px 6px; font-size: 12px; color: #565863">Neste site (github.com)</div>
    <div style="position: relative; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{exts}}" as="x" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 6px 0 8px; border-radius: 8px">
          <span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 7px; background: {{x.tile}}; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{x.letter}}</span>
          <button type="button" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: 0; background: transparent; padding: 0; font: inherit; color: #17181C; text-align: left">
            <span style="font-size: 13px; font-weight: 600">{{x.name}}</span>
            <span style="font-size: 12px; color: #565863">{{x.access}}</span>
          </button>
          <button type="button" aria-label="{{x.pinLabel}}" aria-pressed="{{x.pinned}}" style="flex: none; width: 30px; height: 30px; border: 0; border-radius: 7px; background: {{x.pinBg}}; color: {{x.pinColor}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5 13.5 6.5 10.5 8 8 10.5 6.5 13.5 2.5 9.5 5.5 8 8 5.5Z"></path><path d="m2.5 13.5 3-3"></path></svg></button>
        </div>
      </sc-for>
    </div>

    <div style="position: relative; display: flex; align-items: center; gap: 4px; padding: 8px; border-top: 1px solid rgba(23,24,28,0.08)">
      <button type="button" style="height: 30px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 13px; color: #17181C">Gerenciar extensões</button>
      <div style="flex: 1"></div>
      <button type="button" style="height: 30px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 13px; color: #4352C4">Chrome Web Store</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var mk = function (letter, tile, name, access, pinned) {
      return {
        letter: letter, tile: tile, name: name, access: access, pinned: pinned ? 'true' : 'false',
        pinLabel: pinned ? 'Desafixar ' + name + ' da sidebar' : 'Fixar ' + name + ' na sidebar',
        pinBg: pinned ? '#E9EBF8' : 'transparent',
        pinColor: pinned ? '#4352C4' : '#565863'
      };
    };
    return {
      exts: [
        mk('S', '#3D4452', 'Senhas do iCloud', 'Pode ler e preencher neste site', true),
        mk('R', '#4352C4', 'React Developer Tools', 'Sem acesso a este site', false),
        mk('J', '#2F7D5B', 'JSON Viewer', 'Pode ler este site', false)
      ]
    };
  }
}
</script>
</body>
</html>
