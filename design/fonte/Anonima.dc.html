<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Janela anônima</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#C9CAD2}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #26262B; color: #F1F1F4; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">
  <div style="width: 260px; height: 900px; flex: none">
    <dc-import name="Sidebar" space="anonima" active="nova" domain="" path="Buscar ou digitar endereço" blocked="" hint-size="260px,900px"></dc-import>
  </div>
  <main style="flex: 1; min-width: 0; padding: 8px 8px 8px 0; display: flex">
    <div style="flex: 1; background: #1C1C20; border-radius: 10px; box-shadow: 0 0 0 0.5px rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; padding-top: 240px; box-sizing: border-box">
      <div style="width: 560px; display: flex; flex-direction: column; gap: 32px">
        <div style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; border-radius: 14px; background: #2A2A30; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07)">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#A3A4AD" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"></circle><path d="m10.5 10.5 3 3"></path></svg>
          <label for="anon-busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Buscar ou digitar endereço</label>
          <input id="anon-busca" type="text" placeholder="Buscar ou digitar endereço" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: #F1F1F4; padding: 0">
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 4px">
          <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #D4D5DC; text-wrap: pretty">Nada desta janela fica salvo depois que você fechar: histórico, cookies, logins e dados de formulário somem juntos.</p>
          <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #A3A4AD; text-wrap: pretty">Arquivos baixados continuam na pasta Downloads. Extensões ficam desligadas aqui, a não ser que você libere uma nos Ajustes.</p>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
