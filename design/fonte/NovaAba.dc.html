<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nova aba</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#17181C}a:hover{color:#4352C4}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #E8E9F0; color: #17181C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">
  <div style="width: 260px; height: 900px; flex: none">
    <dc-import name="Sidebar" space="pessoal" theme="claro" active="nova" domain="" path="Buscar ou digitar endereço" blocked="" hint-size="260px,900px"></dc-import>
  </div>
  <main style="flex: 1; min-width: 0; padding: 8px 8px 8px 0; display: flex">
    <div style="flex: 1; background: #FFFFFF; border-radius: 10px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; padding-top: 240px; box-sizing: border-box">
      <div style="width: 560px; display: flex; flex-direction: column; gap: 44px">
        <div style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; border-radius: 14px; background: #F3F3F7; box-shadow: inset 0 0 0 1px rgba(23,24,28,0.07)">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#565863" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"></circle><path d="m10.5 10.5 3 3"></path></svg>
          <label for="nova-aba-busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Buscar ou digitar endereço</label>
          <input id="nova-aba-busca" type="text" placeholder="Buscar ou digitar endereço" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: #17181C; padding: 0">
          <span style="font-size: 11.5px; padding: 2px 6px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); background: #FFFFFF; color: #3A3B42">⌘L</span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{favs}}" as="fav" hint-placeholder-count="8">
            <a href="#" style="height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border-radius: 12px; text-decoration: none">
              <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 12px; background: {{fav.tile}}; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{fav.letter}}</span>
              <span style="font-size: 12.5px">{{fav.name}}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      favs: [
        { letter: 'M', tile: '#B03A63', name: 'Gmail' },
        { letter: 'C', tile: '#4352C4', name: 'Calendário' },
        { letter: 'G', tile: '#3D4452', name: 'GitHub' },
        { letter: 'S', tile: '#2F7D5B', name: 'Spotify' },
        { letter: 'Y', tile: '#B03A63', name: 'YouTube' },
        { letter: 'M', tile: '#6A4FB3', name: 'MDN' },
        { letter: 'E', tile: '#4352C4', name: 'Electron' },
        { letter: 'N', tile: '#3D4452', name: 'Netflix' }
      ]
    };
  }
}
</script>
</body>
</html>
