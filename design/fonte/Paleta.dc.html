<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Paleta com resultados</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4352C4}a:hover{color:#2F3C9A}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; background: #E8E9F0; color: #17181C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">
  <div style="width: 260px; height: 900px; flex: none">
    <dc-import name="Sidebar" space="pessoal" theme="claro" active="p1" hint-size="260px,900px"></dc-import>
  </div>
  <main style="flex: 1; min-width: 0; padding: 8px 8px 8px 0; display: flex">
    <div aria-hidden="true" style="flex: 1; background: #FFFFFF; border-radius: 10px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 14px; padding: 124px 256px 0">
      <span style="width: 64%; height: 32px; border-radius: 6px; background: #DFE0E7"></span>
      <span style="height: 14px"></span>
      <span style="width: 100%; height: 12px; border-radius: 3px; background: #EEEEF2"></span>
      <span style="width: 96%; height: 12px; border-radius: 3px; background: #EEEEF2"></span>
      <span style="width: 58%; height: 12px; border-radius: 3px; background: #EEEEF2"></span>
    </div>
  </main>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23,24,28,0.18)"></div>

  <div role="dialog" aria-label="Paleta de comandos" style="position: absolute; left: 400px; top: 120px; width: 640px; box-sizing: border-box; background: #FFFFFF; border-radius: 14px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.14), 0 24px 64px rgba(0,0,0,0.26); overflow: hidden">
    <div style="display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 18px; border-bottom: 1px solid #EEEEF2">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#565863" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"></circle><path d="m10.5 10.5 3 3"></path></svg>
      <label for="paleta-busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Buscar abas, favoritos, histórico ou digitar endereço</label>
      <input id="paleta-busca" type="text" value="linear" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 18px; color: #17181C; padding: 0">
      <span style="font-size: 11.5px; padding: 2px 6px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); background: #F5F5F8; color: #3A3B42">esc</span>
    </div>

    <div style="padding: 4px 8px 8px">
      <div style="font-size: 12px; font-weight: 600; color: #565863; padding: 10px 10px 6px">Abas abertas</div>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 10px; border-radius: 10px; background: #E9EBF8">
        <span aria-hidden="true" style="flex: none; width: 24px; height: 24px; border-radius: 6px; background: #6A4FB3; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">L</span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 14px; font-weight: 600">Minhas issues no Linear</span>
          <span style="font-size: 12px; color: #4A4C56">linear.app/team/issues</span>
        </div>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #F4E8D6; color: #7A4405"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: #A35A06"></span>Trabalho</span>
        <span style="font-size: 12px; color: #3A3B42">Ir para a aba</span>
        <span style="font-size: 11.5px; padding: 2px 6px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); background: #FFFFFF; color: #3A3B42">↵</span>
      </div>

      <div style="font-size: 12px; font-weight: 600; color: #565863; padding: 12px 10px 6px">Favoritos</div>
      <div style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 10px; border-radius: 10px">
        <span aria-hidden="true" style="flex: none; width: 24px; height: 24px; border-radius: 6px; background: #6A4FB3; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">L</span>
        <span style="flex: 1; font-size: 14px">Roadmap no Linear</span>
        <span style="font-size: 12px; color: #565863">linear.app/roadmap</span>
      </div>

      <div style="font-size: 12px; font-weight: 600; color: #565863; padding: 12px 10px 6px">Histórico</div>
      <div style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 10px; border-radius: 10px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#565863" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2.5 2"></path></svg>
        <span style="flex: 1; font-size: 14px">Changelog do Linear</span>
        <span style="font-size: 12px; color: #565863">ontem</span>
      </div>

      <div style="font-size: 12px; font-weight: 600; color: #565863; padding: 12px 10px 6px">Ações</div>
      <div style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 10px; border-radius: 10px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#565863" stroke-width="1.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"></path></svg>
        <span style="flex: 1; font-size: 14px">Abrir linear.app em nova aba</span>
        <span style="font-size: 11.5px; padding: 2px 6px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); background: #F5F5F8; color: #3A3B42">⌘↵</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 10px; border-radius: 10px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#565863" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="m15.5 15.5 4 4"></path></svg>
        <span style="flex: 1; font-size: 14px">Buscar “linear” na web</span>
        <span style="font-size: 11.5px; padding: 2px 6px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); background: #F5F5F8; color: #3A3B42">⌥↵</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 18px; height: 40px; padding: 0 18px; border-top: 1px solid #EEEEF2; background: #F8F8FA; font-size: 12px; color: #565863">
      <span>↑↓ para navegar</span>
      <span>↵ para abrir</span>
      <span style="flex: 1"></span>
      <span>⇥ busca só no Pessoal</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
