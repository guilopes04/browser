<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sem conexão</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#A35A06}a:hover{color:#7A4405}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #EFEAE1; color: #17181C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">
  <div style="width: 260px; height: 900px; flex: none">
    <dc-import name="Sidebar" space="trabalho" theme="claro" active="t1" domain="linear.app" path="/team/issues" blocked="" hint-size="260px,900px"></dc-import>
  </div>
  <main style="flex: 1; min-width: 0; padding: 8px 8px 8px 0; display: flex">
    <div style="flex: 1; background: #FFFFFF; border-radius: 10px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center">
      <div style="width: 460px; display: flex; flex-direction: column; gap: 16px; margin-top: -60px">
        <svg role="img" aria-label="Sem conexão" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#565863" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9a14 14 0 0 1 19 0"></path><path d="M5.5 12.5a9.5 9.5 0 0 1 13 0"></path><path d="M9 16a4.5 4.5 0 0 1 6 0"></path><circle cx="12" cy="19.25" r="0.75" fill="#565863"></circle><path d="m3 3 18 18"></path></svg>
        <h1 style="margin: 0; font-size: 24px; line-height: 1.25; font-weight: 700">Sem conexão com a internet</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3A3B42; text-wrap: pretty">Não deu para abrir linear.app porque o Mac está desconectado. A página recarrega sozinha quando a conexão voltar.</p>
        <div style="display: flex; gap: 8px; margin-top: 8px">
          <button type="button" style="height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: #A35A06; font: inherit; font-size: 13px; font-weight: 600; color: #FFFFFF; display: flex; align-items: center; gap: 8px">Tentar de novo<span style="font-weight: 400; color: #F7E6CF">⌘R</span></button>
          <button type="button" style="height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: rgba(23,24,28,0.07); font: inherit; font-size: 13px; color: #17181C">Abrir ajustes de rede do Mac</button>
        </div>
        <p style="margin: 8px 0 0; font-size: 12px; color: #565863">Código do erro: ERR_INTERNET_DISCONNECTED</p>
      </div>
    </div>
  </main>
</div>
</x-dc>
