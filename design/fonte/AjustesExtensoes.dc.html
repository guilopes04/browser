<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ajustes, Extensões</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4352C4}a:hover{color:#2F3C9A}
</style>
</helmet>
<div style="width: 760px; height: 640px; display: flex; flex-direction: column; background: #F4F4F7; color: #17181C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">

  <header style="flex: none; background: #ECECF0; border-bottom: 1px solid rgba(23,24,28,0.09)">
    <div style="position: relative; height: 32px; display: flex; align-items: center; justify-content: center">
      <div aria-hidden="true" style="position: absolute; left: 14px; top: 10px; display: flex; gap: 8px">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span>
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #D3D3D8"></span>
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #D3D3D8"></span>
      </div>
      <h1 style="margin: 0; font-size: 13px; font-weight: 600">Extensões</h1>
    </div>
    <nav aria-label="Seções dos ajustes" style="display: flex; justify-content: center; gap: 2px; padding: 0 0 8px">
      <sc-for list="{{panes}}" as="p" hint-placeholder-count="6">
        <button type="button" aria-current="{{p.current}}" style="width: 84px; height: 54px; border: 0; border-radius: 8px; background: {{p.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; font: inherit; color: {{p.color}}">
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; background: {{p.iconBg}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 11px; font-weight: 700">{{p.glyph}}</span>
          <span style="font-size: 11.5px; font-weight: {{p.weight}}">{{p.name}}</span>
        </button>
      </sc-for>
    </nav>
  </header>

  <div style="flex: 1; overflow: hidden; display: flex; justify-content: center; padding: 20px 0">
    <div style="width: 600px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <p style="flex: 1; margin: 0; font-size: 12px; line-height: 1.45; color: #565863">Extensões da Chrome Web Store. Algumas dependem de recursos que este navegador ainda não tem e podem não funcionar.</p>
        <button type="button" style="flex: none; height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: #4352C4; font: inherit; font-size: 13px; font-weight: 600; color: #FFFFFF">Abrir Chrome Web Store</button>
      </div>

      <div style="background: #FFFFFF; border-radius: 10px; box-shadow: 0 0 0 0.5px rgba(23,24,28,0.14)">
        <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 12px">
            <span aria-hidden="true" style="flex: none; width: 30px; height: 30px; border-radius: 8px; background: #3D4452; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">S</span>
            <span style="flex: 1; font-size: 13px; font-weight: 600">Senhas do iCloud</span>
            <label style="position: relative; display: flex; align-items: center">
              <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Ativar Senhas do iCloud</span>
              <input type="checkbox" role="switch" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">
              <span aria-hidden="true" style="flex: none; width: 34px; height: 20px; border-radius: 10px; background: #4352C4; display: flex; align-items: center; justify-content: flex-end; padding: 2px; box-sizing: border-box"><span style="width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span></span>
            </label>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px; padding-left: 42px">
            <div style="display: flex; align-items: center; gap: 12px; height: 34px">
              <span style="flex: 1; font-size: 13px; color: #3A3B42">Acesso a sites</span>
              <button type="button" aria-label="Acesso a sites: Em todos os sites" style="display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px 0 10px; border: 0; border-radius: 6px; background: rgba(23,24,28,0.06); font: inherit; font-size: 13px; color: #17181C">Em todos os sites<svg aria-hidden="true" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#565863" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 6 3.5-3.5L11.5 6M4.5 10l3.5 3.5 3.5-3.5"></path></svg></button>
            </div>
            <div style="display: flex; align-items: center; gap: 12px; height: 34px">
              <span id="ext-espacos" style="flex: 1; font-size: 13px; color: #3A3B42">Ativa nos espaços</span>
              <div role="group" aria-labelledby="ext-espacos" style="display: flex; gap: 6px">
                <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: #E9EBF8; font: inherit; font-size: 12.5px; color: #2F3C9A"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: #4352C4"></span>Pessoal</button>
                <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: #F4E8D6; font: inherit; font-size: 12.5px; color: #7A4405"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: #A35A06"></span>Trabalho</button>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px; height: 34px">
              <span style="flex: 1; font-size: 13px; color: #3A3B42">Fixada na sidebar</span>
              <span style="font-size: 13px; color: #565863">Sim</span>
            </div>
          </div>
        </div>

        <sc-for list="{{others}}" as="x" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; border-top: 1px solid rgba(23,24,28,0.07)">
            <span aria-hidden="true" style="flex: none; width: 30px; height: 30px; border-radius: 8px; background: {{x.tile}}; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{x.letter}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 13px; font-weight: 600">{{x.name}}</span>
              <span style="font-size: 12px; color: #565863">{{x.desc}}</span>
            </span>
            <label style="position: relative; display: flex; align-items: center">
              <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Ativar {{x.name}}</span>
              <input type="checkbox" role="switch" checked="{{x.on}}" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">
              <span aria-hidden="true" style="flex: none; width: 34px; height: 20px; border-radius: 10px; background: {{x.track}}; display: flex; align-items: center; justify-content: {{x.knobSide}}; padding: 2px; box-sizing: border-box"><span style="width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span></span>
            </label>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    var current = 'extensoes';
    var list = [
      { id: 'geral', name: 'Geral', glyph: 'G', tint: '#6E7079' },
      { id: 'espacos', name: 'Espaços', glyph: 'E', tint: '#4352C4' },
      { id: 'bloqueador', name: 'Bloqueador', glyph: 'B', tint: '#2F7D5B' },
      { id: 'privacidade', name: 'Privacidade', glyph: 'P', tint: '#3D4452' },
      { id: 'atalhos', name: 'Atalhos', glyph: '⌘', tint: '#6A4FB3' },
      { id: 'extensoes', name: 'Extensões', glyph: 'X', tint: '#A35A06' }
    ];
    var ext = function (letter, tile, name, desc, on) {
      return { letter: letter, tile: tile, name: name, desc: desc, on: on, track: on ? '#4352C4' : 'rgba(23,24,28,0.18)', knobSide: on ? 'flex-end' : 'flex-start' };
    };
    return {
      panes: list.map(function (p) {
        var on = p.id === current;
        return {
          name: p.name, glyph: p.glyph, iconBg: p.tint,
          bg: on ? 'rgba(23,24,28,0.08)' : 'transparent',
          color: on ? '#17181C' : '#3A3B42',
          weight: on ? 600 : 400,
          current: on ? 'page' : 'false'
        };
      }),
      others: [
        ext('R', '#4352C4', 'React Developer Tools', 'Só no espaço Pessoal, ao clicar', true),
        ext('J', '#2F7D5B', 'JSON Viewer', 'Pessoal e Trabalho, em todos os sites', true),
        ext('D', '#B03A63', 'Modo escuro forçado', 'Desativada', false)
      ]
    };
  }
}
</script>
</body>
</html>
