# Empacotamento do Gilas Browser: assinatura Developer ID, hardened runtime e notarização.
# A notarização usa o perfil da keychain (APPLE_KEYCHAIN_PROFILE=browser-notary, definido
# no script "dist" do package.json). Sem essa variável o electron-builder só assina.
# A pasta de saída é trocada pelos scripts "dist" (GILAS_DIST, padrão ~/Library/Caches/gilas-browser/dist):
# dentro de ~/Documents (iCloud) o macOS põe FinderInfo no .app e o codesign recusa ("detritus not allowed").
appId: com.gilas.browser
productName: Gilas Browser
copyright: Copyright © 2026 Guilherme Lopes
artifactName: 'Gilas-Browser-${version}-${arch}.${ext}'
asar: true
npmRebuild: false
# mantém só os idiomas usados (a interface é em português); o resto cai em inglês
electronLanguages: [en, en_GB, pt_BR, pt_PT]

# Fuses do Electron: gravados no binário na hora do empacotamento, logo antes da assinatura
# (veja docs/seguranca-build.md). Um fuse errado quebra o app, por isso o scripts/confere-build.sh
# confere os valores no build final. As chaves vêm do schema do electron-builder 26.
electronFuses:
  # ELECTRON_RUN_AS_NODE transformaria o binário assinado num Node com os direitos do app
  runAsNode: false
  # NODE_OPTIONS e NODE_EXTRA_CA_CERTS no ambiente não valem
  enableNodeOptionsEnvironmentVariable: false
  # --inspect, --inspect-brk e o sinal SIGUSR1 não abrem o inspetor do processo principal
  enableNodeCliInspectArguments: false
  # o app.asar é validado contra o hash gravado no Info.plist (ElectronAsarIntegrity)
  enableEmbeddedAsarIntegrityValidation: true
  # só carrega o app de dentro do app.asar: uma pasta app/ solta ao lado não é lida
  onlyLoadAppFromAsar: true
  # o banco de cookies é cifrado com a chave da keychain ("Gilas Browser Safe Storage")
  enableCookieEncryption: true
  # páginas file:// não ganham privilégios extras (a shell vem de app://, não de file://)
  grantFileProtocolExtraPrivileges: false
  # no arm64 a mudança nos bytes invalida a assinatura ad-hoc do Electron e o kernel mata o app
  # (SIGKILL na abertura). Em build assinado o electron-builder reassina por cima; no "dist:sem-assinar" é
  # esta linha que deixa o app abrir
  resetAdHocDarwinSignature: true

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Guilherme Lopes
    # Nesta versão toda permissão de site é negada e as entitlements de câmera e microfone não
    # estão assinadas: estes textos só aparecem se a peça de Permissão chegar e as entitlements
    # device.camera e device.audio-input voltarem junto
    NSCameraUsageDescription: Sites que você permitir podem usar a câmera.
    NSMicrophoneUsageDescription: Sites que você permitir podem usar o microfone.
    # registra o app como opção de navegador padrão (http e https)
    CFBundleURLTypes:
      - CFBundleURLName: com.gilas.browser.http
        CFBundleURLSchemes: [http, https]
        LSHandlerRank: Default

dmg:
  title: '${productName} ${version}'
